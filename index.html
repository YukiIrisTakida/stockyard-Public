<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STOCKYARD 資材ロケーション管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  --bg:#090c11;--bg2:#0d121a;--panel:#121823;--panel2:#18202d;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text:#e9eef6;--muted:#8792a6;--dim:#4c5567;--accent:#5ef0c4;--accent-ink:#04231a;--blue:#7aa2ff;--warn:#ffbf5a;--danger:#ff6b7d;
  --font:'Zen Kaku Gothic New',system-ui,-apple-system,'Hiragino Sans',sans-serif;--mono:'Space Grotesk',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text);font-family:var(--font);background:var(--bg)}
body{min-height:100vh;background:radial-gradient(1100px 560px at 85% -10%,rgba(94,240,196,.09),transparent 60%),radial-gradient(900px 520px at -15% 15%,rgba(122,162,255,.08),transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font-family:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:.01em}
.muted{color:var(--muted)} .sm{font-size:12.5px} .warn{color:var(--warn)} .center{text-align:center}
.ic{flex:none;display:block}
.sp{flex:1}
.row{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap} .row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.big{font-size:26px;font-weight:700;line-height:1.1} .big small{font-size:12px;color:var(--muted);margin-left:3px;font-family:var(--font);font-weight:500}
.xl{font-size:30px;font-weight:700;line-height:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));display:inline-block;box-shadow:0 0 10px var(--c,var(--accent))}

/* top */
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--blue));z-index:90;transition:width .3s,opacity .3s;opacity:0}
#bar.on{width:70%;opacity:1}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(9,12,17,.72);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;color:#05140f;box-shadow:0 6px 20px rgba(94,240,196,.25)}
.b1{font-family:var(--mono);font-weight:700;letter-spacing:.18em;font-size:14px}
.b2{font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.top-r{display:flex;align-items:center;gap:10px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.ok{background:var(--accent);box-shadow:0 0 10px var(--accent)} .sync.ng{background:var(--warn)}
.lockbtn{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font:600 12px var(--mono);cursor:pointer}
.lockbtn.open{color:var(--accent-ink);background:var(--accent);border-color:transparent}

main#view{max-width:1120px;margin:0 auto;padding:16px 16px calc(130px + env(safe-area-inset-bottom))}
.page-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 14px}
.page-h h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:2px;padding:6px;border-radius:24px;background:rgba(18,24,35,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.55);width:min(calc(100% - 24px),500px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;background:none;color:var(--muted);font:500 10.5px var(--font);border-radius:18px;cursor:pointer;transition:.15s}
.nav button.on{color:var(--text);background:rgba(255,255,255,.07)}
.nav .scanbtn{flex:0 0 62px;height:62px;margin:-24px 4px 0;border-radius:21px;background:linear-gradient(135deg,var(--accent),#46c8ff);color:#04231a;box-shadow:0 10px 30px rgba(94,240,196,.38);justify-content:center}
.nav .scanbtn.on{background:linear-gradient(135deg,#8ff7d8,#7fd9ff);color:#04231a}
.nav .scanbtn span{display:none}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:600 14px var(--font);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:rgba(255,255,255,.26)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px rgba(94,240,196,.18)}
.btn.danger{background:var(--danger);color:#2a0007;border-color:transparent}
.btn.ghost{background:transparent}
.btn.ghost.danger{background:transparent;color:var(--danger);border-color:rgba(255,107,125,.35)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.lg{height:54px;font-size:16px;border-radius:16px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;pointer-events:none}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.link{background:none;border:0;color:var(--accent);font:600 12px var(--font);cursor:pointer;padding:4px}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font:500 16px var(--font);outline:none;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:12px 14px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,240,196,.14)}
input::placeholder,textarea::placeholder{color:var(--dim)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 8px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.switch{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;background:rgba(255,255,255,.015)}
.switch input{display:none}
.switch i{flex:0 0 42px;height:24px;border-radius:99px;background:var(--dim);position:relative;transition:.2s;margin-top:1px}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--accent)} .switch input:checked+i::after{left:21px}
.switch span{display:flex;flex-direction:column;gap:2px;font-size:14px} .switch small{color:var(--muted);font-size:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.swatches label{cursor:pointer} .swatches input{display:none}
.swatches i{display:block;width:30px;height:30px;border-radius:10px;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--bg)}
.swatches input:checked+i{border-color:#fff}

/* search & chips */
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line2);color:var(--muted)}
.search input{border:0;background:none;height:100%;padding:0;box-shadow:none!important}
.search.sm{height:44px;margin-bottom:10px}
.chips{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.sub{margin-top:8px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--muted);font:600 13px var(--font);cursor:pointer}
.chips.sub .chip{height:30px;font-size:12px}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.kpi{padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.kpi .v{font:700 22px var(--mono);margin-top:4px}
.kpi.w .v{color:var(--warn)}
@media(max-width:420px){.kpi{padding:10px}.kpi .v{font-size:19px}.kpi .eyebrow{font-size:10px;letter-spacing:.06em}}

/* material cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mcard{position:relative;padding:16px;border-radius:20px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s}
.mcard::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--c);opacity:.9}
.mcard::after{content:'';position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.06;filter:blur(10px)}
.mcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.mcard.zero{opacity:.55}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.tag .dot{width:6px;height:6px}
.lk{color:var(--warn);opacity:.8}
.mc-name{font-size:17px;font-weight:700;margin-top:10px;line-height:1.35}
.mc-code{font-size:12px;color:var(--muted);margin-top:2px}
.mc-qty{margin-top:12px;display:flex;align-items:baseline;gap:4px}
.mc-qty .mono{font-size:30px;font-weight:700;letter-spacing:-.01em}
.mc-qty small{color:var(--muted);font-size:12px}
.mc-bar{display:flex;gap:12px;font-size:12.5px;margin-top:6px;align-items:center}
.mc-bar .fr{color:var(--warn)}
.mc-locs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mc-locs span{display:inline-flex;align-items:center;gap:3px;font:600 11.5px var(--mono);padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.05);color:var(--muted)}
.mc-locs b{color:var(--text);margin-left:2px}
.sect-h{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:18px}
.empty.sm{padding:18px}
.fab{position:fixed;right:max(16px,calc(50% - 544px));bottom:calc(96px + env(safe-area-inset-bottom));z-index:35;display:flex;align-items:center;gap:6px;height:48px;padding:0 18px 0 14px;border-radius:16px;border:0;background:var(--text);color:var(--bg);font:700 14px var(--font);box-shadow:0 12px 30px rgba(0,0,0,.45);cursor:pointer}

/* pallet rows */
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-bottom:6px;transition:border-color .15s,background .15s}
.prow.sel{border-color:var(--accent);background:rgba(94,240,196,.07)}
.ck{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center;color:transparent;cursor:pointer}
.prow.sel .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pr-main{flex:1;min-width:0;cursor:pointer}
.pr-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-sub{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.pr-sub span{display:inline-flex;align-items:center;gap:3px}
.pr-sub .mono{color:var(--text);font-weight:600}
.pr-qty{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pr-qty .mono{font-size:17px;font-weight:700}
.pr-qty small{font-size:10.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted)}
.badge.frac{background:rgba(255,191,90,.15);color:var(--warn)}
.group{margin-top:16px}
.group-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:13px;font-weight:700}
.group-h>span:first-child{display:inline-flex;align-items:center;gap:5px}
.group-h .muted{font-weight:500;font-size:12px}

/* layers */
.layer{position:fixed;inset:0;display:none}
.layer.open{display:block}
#sheet{z-index:50} #modal{z-index:60} #pin{z-index:66}
.backdrop{position:absolute;inset:0;background:rgba(3,5,8,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:var(--panel);border-radius:26px 26px 0 0;border:1px solid var(--line2);border-bottom:0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:4px auto 6px}
.x-btn{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:var(--muted);display:grid;place-items:center;cursor:pointer;z-index:2}
@media(min-width:760px){
  .panel{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:min(700px,92vw);max-height:86vh;border-radius:24px;border-bottom:1px solid var(--line2);animation:pop .22s;padding-top:18px}
  .panel .grab{display:none}
}
.mpanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 24px));max-height:88vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:translate(-50%,-47%);opacity:0}}
.mt{font-size:18px;font-weight:900;margin-bottom:4px}
.ms{font-size:13px;color:var(--muted);margin-bottom:16px}
.mh{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.mh-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,191,90,.14);color:var(--warn);flex:none}
.ferr,.err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0}
form.busy{opacity:.6;pointer-events:none}
.pin-input{text-align:center;font-size:28px;letter-spacing:.5em;height:60px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.qty-row{display:flex;gap:8px} .qty-row .btn{width:52px;height:46px;font-size:20px} .qty-row input{font-size:20px;font-weight:700}

/* sheet content */
.sh-head{padding:6px 40px 4px 0}
.sh-head h2{margin:8px 0 2px;font-size:22px;font-weight:900;line-height:1.3}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 8px}
.stats3>div{padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.pal-hero{display:flex;gap:16px;align-items:center;margin:16px 0;padding:14px;border-radius:18px;background:var(--bg2);border:1px solid var(--line)}
.qrbox{flex:none;width:96px;height:96px;padding:6px;border-radius:12px;background:#fff}
.qrbox svg{width:100%;height:100%;display:block}
.kv{display:grid;grid-template-columns:76px 1fr;gap:12px 10px;align-items:center;margin:8px 0 16px;font-size:14px}
.kv .k{color:var(--muted);font-size:12px}
.kv .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv .v.loc{font-weight:700;font-size:16px}
.actions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.act-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 4px;border-radius:16px;border:1px solid var(--line2);background:var(--panel2);font:600 12px var(--font);cursor:pointer;color:var(--text)}
.act-tile.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.act-tile:active{transform:scale(.96)}
.hist{display:flex;flex-direction:column;gap:2px}
.hrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
.hrow .t{flex:none;width:82px;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.hrow .a{flex:none;font-weight:700;width:44px}
.hrow .d{flex:1;color:var(--text)}
.hrow .u{color:var(--muted)}
.selbar{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:16px -18px calc(-20px - env(safe-area-inset-bottom));padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:rgba(24,32,45,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line2);display:none;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.selbar.show{display:flex}
.selbar .mono{font-size:18px;font-weight:700;color:var(--accent)}

/* scan */
.seg{display:flex;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border:0;border-radius:10px;background:none;color:var(--muted);font:700 13.5px var(--font);cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg)}
.scan{max-width:560px;margin:0 auto}
.cam{position:relative;aspect-ratio:1/1;max-height:54vh;width:100%;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#162030,#06080c);border:1px solid var(--line2)}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.cam.live video{opacity:1}
.reticle{position:absolute;inset:17%;pointer-events:none}
.reticle i{position:absolute;width:36px;height:36px;border:3px solid var(--accent);filter:drop-shadow(0 0 8px rgba(94,240,196,.6))}
.reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.reticle b{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);top:10%;opacity:0}
.cam.live .reticle b{animation:sweep 2.2s ease-in-out infinite;opacity:1}
@keyframes sweep{50%{top:88%}}
.cam-off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.cam.live .cam-off{display:none}
.cam-msg{font-size:12.5px;color:var(--muted);max-width:280px;line-height:1.6}
.cam-stop{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;display:none;place-items:center;cursor:pointer}
.cam.live .cam-stop{display:grid}
.cam-badge{position:absolute;left:12px;top:12px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.55);font:700 11px var(--font);letter-spacing:.08em;display:none}
.cam.live .cam-badge{display:block}
.cam.flash::after{content:'';position:absolute;inset:0;background:rgba(94,240,196,.28);animation:fade .45s reverse forwards}
.manual{display:flex;gap:8px;margin:12px 0}
.manual input{height:46px;font-family:var(--mono);font-size:15px}
.manual .btn{width:52px;padding:0;height:46px}
.hint{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6}
.tray-head{display:flex;align-items:flex-end;justify-content:space-between;margin:16px 2px 10px}
.tray-list{max-height:34vh;overflow:auto;margin-bottom:10px}
.dest{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px dashed var(--line2);margin-bottom:10px;cursor:pointer;color:var(--muted)}
.dest>div{flex:1}
.dest.set{border-style:solid;border-color:var(--blue);background:rgba(122,162,255,.08);color:var(--text)}
.dest-name{font-size:16px;font-weight:700;margin-top:2px}

/* locations */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.lcard{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color .15s}
.lcard:hover{border-color:var(--line2)}
.lcard .code{font:700 20px var(--mono)}
.lcard .nm{font-size:12px;color:var(--muted);min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .cnt{display:flex;align-items:baseline;gap:4px;margin-top:10px}
.lcard .cnt b{font:700 22px var(--mono)}
.lcard .cnt small{color:var(--muted);font-size:11px}
.lcard .mats{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard.emptyloc{opacity:.5}
.lcard.none{border-style:dashed}
.lp-list{max-height:52vh;overflow:auto;margin:0 -4px;padding:0 4px}
.lp-area{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:12px 0 6px}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.lp-item{padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);text-align:left;cursor:pointer}
.lp-item b{display:block;font:700 15px var(--mono)} .lp-item small{color:var(--muted);font-size:11px}
.lp-item.cur{border-color:var(--blue)}

/* cards (admin/print) */
.card{padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;margin-bottom:10px}
.card-h .sp{flex:1}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.lrow:last-child{border-bottom:0}
.lrow .main{flex:1;min-width:0}
.lrow .sub{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.06);color:var(--muted)}
.pill.on{background:rgba(255,191,90,.14);color:var(--warn)}
.pill.ok{background:rgba(94,240,196,.12);color:var(--accent)}
.foot{text-align:center;font-size:11px;letter-spacing:.14em;margin-top:20px;font-family:var(--mono)}
.lbl-prev{overflow:hidden;border-radius:12px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.lbl-prev>.lbl{transform-origin:top left}
.setup{max-width:520px;margin:6vh auto}
.setup ol{padding-left:18px;color:var(--muted);font-size:13px;line-height:1.8}
.skeleton{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}

/* toast */
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:rgba(30,38,52,.96);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:13.5px;animation:pop2 .25s;transition:opacity .3s,transform .3s;max-width:100%}
.toast span{flex:1}
.toast.ok{border-color:rgba(94,240,196,.4)} .toast.err{border-color:rgba(255,107,125,.5);color:#ffd7dc}
.toast button{border:0;background:var(--accent);color:var(--accent-ink);font:700 12px var(--font);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes pop2{from{opacity:0;transform:translateY(-10px)}}

/* ===== labels (screen preview + print) ===== */
.lbl{background:#fff;color:#000;display:flex;align-items:center;overflow:hidden;font-family:'Zen Kaku Gothic New',sans-serif;box-sizing:border-box;border:.25mm dashed #c8c8c8}
.lbl.L8{width:105mm;height:74.25mm;padding:6mm;gap:4mm}
.lbl.L8 .lq{flex:0 0 50mm;width:50mm;height:50mm}
.lbl.L2{width:210mm;height:148.5mm;padding:12mm;gap:9mm}
.lbl.L2 .lq{flex:0 0 112mm;width:112mm;height:112mm}
.lbl .lq svg{width:100%;height:100%;display:block}
.lbl .li{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.2mm}
.l-sec{font-size:7.5pt;letter-spacing:.06em;color:#444;font-weight:700}
.l-name{font-size:13pt;font-weight:900;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.l-code{font-size:9pt;font-family:'Space Grotesk',monospace}
.l-pal{font-size:15pt;font-weight:700;font-family:'Space Grotesk',monospace;margin-top:1mm;border-top:.4mm solid #000;padding-top:1.5mm}
.l-meta{font-size:9pt}
.l-frac{border:.35mm solid #000;padding:0 1mm;border-radius:1mm;font-weight:900}
.l-loc{font-size:26pt;font-weight:700;font-family:'Space Grotesk',monospace;line-height:1.05;word-break:break-all}
.L2 .l-sec{font-size:13pt}.L2 .l-name{font-size:26pt}.L2 .l-code{font-size:16pt}.L2 .l-pal{font-size:30pt}.L2 .l-meta{font-size:16pt}.L2 .l-loc{font-size:54pt}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .ppage{width:210mm;height:297mm;display:grid;break-after:page;page-break-after:always;overflow:hidden}
  .ppage:last-child{break-after:auto;page-break-after:auto}
  .ppage.L8{grid-template-columns:105mm 105mm;grid-template-rows:repeat(4,74.25mm)}
  .ppage.L2{grid-template-columns:210mm;grid-template-rows:repeat(2,148.5mm)}
  .lbl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="bar"></div>
<header class="top">
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></div>
    <div><div class="b1">STOCKYARD</div><div class="b2">資材ロケーション管理</div></div>
  </div>
  <div class="top-r"><span id="sync" class="sync" title="同期状態"></span><button id="lockBtn" class="lockbtn" data-act="lockAll"></button></div>
</header>
<main id="view"></main>
<nav class="nav" id="nav"></nav>
<div id="sheet" class="layer"><div class="backdrop" data-act="closeSheet"></div><div class="panel"><div class="grab"></div><button class="x-btn" data-act="closeSheet" aria-label="閉じる"></button><div class="sheet-body"></div></div></div>
<div id="modal" class="layer"><div class="backdrop" data-act="modalCancel"></div><div class="mpanel modal-body"></div></div>
<div id="pin" class="layer"><div class="backdrop" data-act="pinCancel"></div><div class="mpanel pin-body"></div></div>
<div id="toasts"></div>
<div id="printArea"></div>

<script>
/* =====================================================================
   設定 : Firebase の接続情報をここに書いておくと、全端末で入力不要になります
   (空のままでも、初回起動時の設定画面から端末ごとに貼り付けできます)
   Firebase コンソール > プロジェクトの設定 > マイアプリ の firebaseConfig の値
   ===================================================================== */
const CONFIG = {
  FIREBASE: {
    apiKey: '',
    authDomain: '',
    projectId: '',
    appId: ''
  },
  APP_URL: ''  // このHTMLの公開URL (QRをスマホ標準カメラで読んでも開けるようになる)
};
const VERSION='2.1 (Firebase)';
const ADMIN_EMAIL='admin@stockyard.app';
const CANCEL='キャンセルしました';

/* ---------- utils ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n==null||n==='')?'-':Number(n).toLocaleString('ja-JP',{maximumFractionDigits:3});
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const groupBy=(arr,key)=>{const m=new Map();for(const x of arr){const k=typeof key==='function'?key(x):x[key];const kk=k??null;if(!m.has(kk))m.set(kk,[]);m.get(kk).push(x);}return m;};
const cmp=(a,b)=>String(a??'').localeCompare(String(b??''),'ja',{numeric:true});
const toDate=v=>!v?null:(v.toDate?v.toDate():new Date(v));
const dt=v=>{const d=toDate(v);return d?d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';};
const store=(st)=>({get(k,d){try{const v=st.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{st.setItem(k,JSON.stringify(v))}catch(e){}}});
const LS=store(window.localStorage), SS=store(window.sessionStorage);
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};

function parseFbConfig(t){t=String(t||'');const o={};
  const re=/["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"']+)["']/g;let m;
  while((m=re.exec(t)))o[m[1]]=m[2].trim();return o;}
function cfg(){const s=LS.get('sy_fbcfg',{})||{};const c=CONFIG.FIREBASE||{};
  const fbc=(s.fb&&s.fb.apiKey)?s.fb:c;
  return{fb:{apiKey:(fbc.apiKey||'').trim(),authDomain:(fbc.authDomain||'').trim(),projectId:(fbc.projectId||'').trim(),appId:(fbc.appId||'').trim()},app:s.app||CONFIG.APP_URL||''};}

/* ---------- icons ---------- */
const I={
 box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
 pin:'<path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
 scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/>',
 print:'<path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
 lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 unlock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 check:'<path d="m5 12 5 5L20 7"/>',
 qr:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 14h2M14 18h2M18 18h2v2"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
 move:'<path d="M3 12h13M12 7l5 5-5 5"/><path d="M20 5v14"/>',
 tray:'<path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/>',
 chev:'<path d="m9 6 6 6-6 6"/>',
 cam:'<path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/>',
 layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
 down:'<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>',
};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[n]||''}</svg>`;
$('.x-btn').innerHTML=ic('x',18);

/* ---------- state ---------- */
let fbApp=null,auth=null,db=null,FV=null;
const S={sections:[],materials:[],locations:[],pallets:[],role:null,actor:LS.get('sy_actor',''),
  tab:'stock',f:{sec:'all',cat:'all',q:''},lq:'',tray:SS.get('sy_tray',[])||[],dest:null,scanMode:'lookup',
  printQ:LS.get('sy_printq',[])||[],layout:LS.get('sy_layout','8'),sel:new Set(),sheetRefresh:null,modalResolve:null,pinResolve:null,ready:false};
const M={sec:new Map(),mat:new Map(),loc:new Map(),pal:new Map(),locByCode:new Map()};
const view=$('#view');
const saveTray=()=>SS.set('sy_tray',S.tray);
const savePrint=()=>LS.set('sy_printq',S.printQ);
const actor=()=>S.actor||(S.role&&S.role.admin?S.role.label:null)||null;
const secOf=m=>M.sec.get(m?.section_id);
const isFrac=p=>{const m=M.mat.get(p.material_id);return !!(m&&+m.std_qty>0&&+p.qty<+m.std_qty);};
const locCode=id=>M.loc.get(id)?.code||'未設定';
const locName=id=>{const l=M.loc.get(id);return l?l.code+(l.name?' '+l.name:''):'未設定';};
const lockState=m=>{const s=secOf(m);return{edit:!!(m?.locked||s?.lock_edit),move:!!(m?.locked||s?.lock_move)};};
const palByCode=c=>M.pal.get(String(c||'').toUpperCase());

/* ---------- auth & permission ---------- */
const P=()=>firebase.auth.Auth.Persistence;
async function loadRole(){const u=auth.currentUser;
  if(!u||u.isAnonymous){S.role=null;}
  else{try{const d=await db.collection('roles').doc(u.uid).get();S.role=d.exists?d.data():null;}catch(e){S.role=null;}}
  updateLockBtn();}
async function signInAs(email,pw){await auth.setPersistence(P().SESSION);await auth.signInWithEmailAndPassword(email,pw);await loadRole();}
async function signInAnon(){await auth.setPersistence(P().LOCAL);await auth.signInAnonymously();}
// サインアウトを挟まず匿名に切り替える（未ログインの瞬間を作らずリアルタイム同期を維持）
async function lockAll(){S.role=null;updateLockBtn();await signInAnon();await loadRole();}
const covers=sec=>!!(S.role&&(S.role.admin||(S.role.sections||[]).includes(sec)));
function needs(sec,kind,locked){
  if(kind==='admin')return !(S.role&&S.role.admin);
  if(covers(sec))return false;
  const s=M.sec.get(sec)||{};
  return kind==='pin'||(kind==='edit'&&(s.lock_edit||locked))||(kind==='move'&&(s.lock_move||locked));}
async function ensure(sec,kind,locked=false){
  if(!needs(sec,kind,locked))return;
  const ok=await askPin(kind==='admin'?'__admin__':sec);
  if(!ok||needs(sec,kind,locked))throw new Error(CANCEL);}
function roleLabel(){if(!S.role)return '';if(S.role.admin)return S.role.label&&S.role.label!=='管理者'?'管理者：'+S.role.label:'管理者';
  return (S.role.sections||[]).map(id=>M.sec.get(id)?.name||id).join('・')||'解除中';}
function updateLockBtn(){const b=$('#lockBtn');if(!b)return;const on=!!S.role;b.className='lockbtn'+(on?' open':'');
  b.innerHTML=on?`${ic('unlock',15)}${esc(roleLabel())}`:ic('lock',15);b.title=on?'ロック解除中 (タップでロック)':'ロック中';}

/* ---------- data (realtime) ---------- */
let busyN=0;function busy(on){busyN=Math.max(0,busyN+(on?1:-1));$('#bar').classList.toggle('on',busyN>0);}
function derive(){
  M.sec=new Map(S.sections.map(x=>[x.id,x]));
  const secIdx=new Map(S.sections.map((s,i)=>[s.id,i]));
  S.materials.sort((a,b)=>(secIdx.get(a.section_id)??99)-(secIdx.get(b.section_id)??99)||cmp(a.category,b.category)||cmp(a.code,b.code));
  M.mat=new Map(S.materials.map(x=>[x.id,x]));
  M.loc=new Map(S.locations.map(x=>[x.id,x]));M.locByCode=new Map(S.locations.map(x=>[String(x.code).toUpperCase(),x]));
  S.pallets.forEach(p=>{if(p.location_id&&!M.loc.has(p.location_id))p.location_id=null;});
  M.pal=new Map(S.pallets.map(x=>[x.id,x]));}
let rfT=null;function schedRefresh(){clearTimeout(rfT);rfT=setTimeout(()=>{if(S.ready)refreshViews();},120);}
function setSync(st){const e=$('#sync');if(e)e.className='sync '+st;}
let unsubs=[],relT=null;
function relisten(){clearTimeout(relT);relT=setTimeout(()=>{listen().catch(()=>relisten());},3000);}
function listen(){
  unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];
  return new Promise((resolve,reject)=>{
    const need=new Set(['sections','locations','materials','pallets']);let failed=false;
    const on=(name,q,map)=>unsubs.push(q.onSnapshot(s=>{
        S[name]=s.docs.map(d=>({id:d.id,...d.data()})).filter(map||(()=>true));derive();
        setSync(s.metadata.fromCache?'ng':'ok');
        if(need.delete(name)&&!need.size)resolve();else schedRefresh();},
      err=>{setSync('ng');if(need.size&&!S.ready){if(!failed){failed=true;reject(err);}}else if(!failed){failed=true;relisten();}}));
    on('sections',db.collection('sections'));
    on('locations',db.collection('locations'),l=>l.active!==false);
    on('materials',db.collection('materials'));
    on('pallets',db.collection('pallets').where('status','==','active'));
  });}
function errMsg(e){const c=e?.code||'';const m=e?.message||String(e);
  if(m===CANCEL)return m;
  if(c==='permission-denied')return '権限がありません（ロック中、またはセキュリティルール未設定）';
  if(c==='unavailable')return 'サーバーに接続できません。電波・ネットワークを確認してください';
  if(c==='auth/network-request-failed')return '通信できません。ネットワークを確認してください';
  if(c==='auth/operation-not-allowed'||c==='auth/admin-restricted-operation')return 'Firebaseで「匿名」または「メール/パスワード」ログインが有効になっていません';
  if(c==='auth/configuration-not-found')return 'FirebaseのAuthentication（ログイン機能）が開始されていません';
  if(/api-key-not-valid|invalid-api-key/.test(c))return 'apiKey が正しくありません';
  if(c==='auth/too-many-requests')return '試行回数が多すぎます。しばらく待ってからやり直してください';
  if(c==='auth/weak-password')return 'PIN・パスワードは6桁以上にしてください';
  if(c==='auth/operation-not-supported-in-this-environment')return 'この開き方ではログインできません。公開URL（https）から開いてください';
  if(c==='failed-precondition')return 'データベースの準備が完了していません（Firestoreが作成されているか確認）';
  if(c==='not-found')return 'データベースが見つかりません。Firestore Database を作成してください';
  return m;}
async function run(fn){try{busy(true);return await fn();}catch(e){if(e?.message!==CANCEL)toast(errMsg(e),'err');}finally{busy(false);}}

async function upsertMaterial(p){

  if(S.materials.some(m=>m.id!==p.id&&String(m.code).toUpperCase()===d.code.toUpperCase()))throw new Error('資材コード「'+d.code+'」は既に登録されています');

async function allocCodes(n){
  const ref=db.collection('meta').doc('counter');
  const start=await db.runTransaction(async tx=>{const s=await tx.get(ref);const cur=s.exists?(s.data().pallet||0):0;
    if(s.exists)tx.update(ref,{pallet:cur+n});else tx.set(ref,{pallet:n});return cur+1;});
  return Array.from({length:n},(_,i)=>'P-'+String(start+i).padStart(6,'0'));}
async function createPallets(mid,count,qty,loc,lot){const m=M.mat.get(mid);if(!m)throw new Error('資材が見つかりません');
  count=Math.floor(+count);if(!(count>=1&&count<=100))throw new Error('登録数は1〜100で指定してください');
  if(!(+qty>=0))throw new Error('数量は0以上で入力してください');
  await ensure(m.section_id,'edit',!!m.locked);
  const codes=await allocCodes(count);const out=[];
  for(const part of chunk(codes,10)){
    await Promise.all(part.map(async code=>{const b=db.batch();
      b.set(db.collection('pallets').doc(code),{code,material_id:mid,section_id:m.section_id,qty:+qty,lot:String(lot||'').trim()||null,
        location_id:loc||null,status:'active',note:null,created_at:TS(),updated_at:TS(),updated_by:actor()});
      logMove(b,code,{action:'create',to:loc||null,qa:+qty,sec:m.section_id});
      await b.commit();out.push(code);}));}
  return out.sort();}

  if(+qty!==+p.qty)logMove(b,id,{action:'qty',from:p.location_id,qb:p.qty,qa:+qty,sec:p.section_id});

function groupForAuth(pals,kind){return [...groupBy(pals,p=>p.section_id+'|'+(M.mat.get(p.material_id)?.locked?1:0))].map(([k,ps])=>({sec:k.split('|')[0],locked:k.endsWith('|1'),ps,kind}));}
async function perPallet(pals,kind,fn){let n=0;

/* ---------- QR ---------- */
function appBase(){const c=cfg().app;if(c)return c.split('#')[0];if(/^https?:$/.test(location.protocol))return location.href.split('#')[0];return '';}
function qrText(t,code){const b=appBase();return b?`${b}#${t}=${encodeURIComponent(code)}`:`${t}=${encodeURIComponent(code)}`;}
function qrSvg(text){if(!window.qrcode)return '<div style="color:#000;font-size:10px">QR</div>';const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:8,scalable:true});}
function parseQR(raw){const t=String(raw||'').trim();if(!t)return null;
  let m=t.match(/[#?&]([pl])=([^&#\s]+)/i)||t.match(/^([pl])[=:]([^\s]+)$/i);
  if(m){let code;try{code=decodeURIComponent(m[2]);}catch(e){code=m[2];}return{type:m[1].toLowerCase(),code:code.toUpperCase()};}
  const u=t.toUpperCase();
  if(M.pal.has(u)||/^P-\d+$/.test(u))return{type:'p',code:u};
  if(M.locByCode.has(u))return{type:'l',code:u};
  return null;}

function renderStockList(){
  const el=$('#stockList');if(!el)return;

  const pb=groupBy(S.pallets,'material_id');
  let mats=base,palHits=[];
  if(q){const ids=new Set(base.map(m=>m.id));
    mats=base.filter(m=>(m.name+' '+m.code+' '+(m.category||'')).toLowerCase().includes(q));

function openMaterial(id){const m=M.mat.get(id);if(!m){closeSheet();return;}const s=secOf(m);

   ${used?`<div class="row"><button class="btn" data-act="palRestore" data-id="${p.id}">在庫に戻す</button></div>`:`<div class="actions-grid">

   <div class="group"><div class="group-h"><span>${ic('history',14)}履歴</span></div><div id="hist" class="hist"><div class="muted sm">読み込み中…</div></div></div>`,
   used?null:()=>openPallet(p.id));
  loadHistory(p.id);}
const ACTION_L={create:'登録',move:'移動',qty:'数量',used:'使用',restore:'復帰'};
async function loadHistory(pid){let rows=[];
  try{const s=await db.collection('movements').where('pallet_id','==',pid).limit(200).get();rows=s.docs.map(d=>d.data());}catch(e){}
  const el=$('#hist');if(!el)return;
  rows.sort((a,b)=>(toDate(b.at)||0)-(toDate(a.at)||0));rows=rows.slice(0,30);
  if(!rows.length){el.innerHTML='<div class="muted sm">履歴はありません</div>';return;}
  el.innerHTML=rows.map(h=>{let d='';
    if(h.action==='move')d=`${esc(locCode(h.from_location))} → <b>${esc(locCode(h.to_location))}</b>`;
    else if(h.action==='qty')d=`${fmt(h.qty_before)} → <b>${fmt(h.qty_after)}</b>`;
    else if(h.action==='create')d=`${fmt(h.qty_after)} @ ${esc(locCode(h.to_location))}`;
    else d=`${fmt(h.qty_after)}`;
    return `<div class="hrow"><span class="t">${dt(h.at)}</span><span class="a">${ACTION_L[h.action]||esc(h.action)}</span><span class="d">${d}</span><span class="u">${esc(h.actor||'')}${h.by&&h.by!==h.actor?' / '+esc(h.by):''}</span></div>`;}).join('');}

function renderLocs(){

function renderLocList(){const el=$('#locList');if(!el)return;const q=S.lq.trim().toLowerCase();
  const byLoc=groupBy(S.pallets,'location_id');
  const matNames=lid=>[...new Set((byLoc.get(lid)||[]).map(p=>M.mat.get(p.material_id)?.name).filter(Boolean))];
  const ls=sortedLocs().filter(l=>!q||(l.code+' '+(l.name||'')+' '+(l.area||'')+' '+matNames(l.id).join(' ')).toLowerCase().includes(q));
  const none=byLoc.get(null)||[];
  const card=(l,ps,cls='')=>`<div class="lcard ${ps.length?'':'emptyloc'} ${cls}" data-act="openLoc" data-id="${l.id}"><div class="code">${esc(l.code)}</div><div class="nm">${esc(l.name||'')}</div><div class="cnt"><b>${ps.length}</b><small>PL</small>${ps.some(isFrac)?'<span class="badge frac" style="margin-left:6px">端数</span>':''}</div><div class="mats">${esc(matNames(l.id).join('・')||'空き')}</div></div>`;
  el.innerHTML=(none.length&&!q?`<div class="sect-h">${ic('pin',14)}未設定</div><div class="lgrid">${card({id:'none',code:'未設定',name:'場所未登録のパレット'},none,'none')}</div>`:'')+

const Scan={stream:null,running:false,det:null,cv:document.createElement('canvas'),last:'',lastT:0,timer:null,
  async start(){if(this.running)return;const v=$('#camVideo');if(!v)return;
    if(!navigator.mediaDevices?.getUserMedia){setCamMsg('この開き方ではカメラを使えません。公開URL（https）から開いてください。下の入力欄やUSBスキャナは使えます。');return;}
    try{this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});}
    catch(e){setCamMsg('カメラを起動できませんでした（'+(e.name||e.message)+'）。ブラウザのカメラ許可を確認してください。');return;}
    if(S.tab!=='scan'||!$('#camVideo')){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;return;}
    const vv=$('#camVideo');vv.srcObject=this.stream;vv.muted=true;vv.setAttribute('playsinline','');await vv.play().catch(()=>{});
    if(!this.det&&'BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))this.det=new BarcodeDetector({formats:['qr_code']});}catch(e){}}
    this.running=true;$('#cam')?.classList.add('live');this.loop();},
  stop(){this.running=false;clearTimeout(this.timer);if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}$('#cam')?.classList.remove('live');},
  async loop(){if(!this.running)return;const v=$('#camVideo');
    try{if(v&&v.readyState>=2&&v.videoWidth){let text=null;
      if(this.det){const r=await this.det.detect(v);if(r.length)text=r[0].rawValue;}
      else if(window.jsQR){const w=v.videoWidth,h=v.videoHeight,sc=Math.min(1,720/Math.max(w,h)),cw=Math.round(w*sc),ch=Math.round(h*sc);
        this.cv.width=cw;this.cv.height=ch;const ctx=this.cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0,cw,ch);
        const r=jsQR(ctx.getImageData(0,0,cw,ch).data,cw,ch,{inversionAttempts:'dontInvert'});if(r)text=r.data;}
      if(text){const now=Date.now();if(text!==this.last||now-this.lastT>2500){this.last=text;this.lastT=now;onScan(text,'cam');}}}}catch(e){}
    this.timer=setTimeout(()=>this.loop(),130);}};
function setCamMsg(t){const e=$('#camMsg');if(e)e.textContent=t;}
let AC=null;function beep(ok=true){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.value=ok?1320:280;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(ok?.13:.32));o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.35);}catch(e){}}
function feedback(ok){beep(ok);try{navigator.vibrate&&navigator.vibrate(ok?35:[70,50,70]);}catch(e){}if(ok){const c=$('#cam');if(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');}}}
async function onScan(text,src){
  if($('#modal').classList.contains('open')||$('#pin').classList.contains('open'))return;
  if(src==='cam'&&$('#sheet').classList.contains('open'))return;
  const q=parseQR(text);
  if(!q){feedback(false);toast('認識できないコード: '+String(text).slice(0,40),'err');return;}
  const moveMode=S.tab==='scan'&&S.scanMode==='move';
  if(q.type==='l'){const l=M.locByCode.get(q.code);if(!l){feedback(false);toast('未登録の場所: '+q.code,'err');return;}
    feedback(true);if(moveMode){S.dest=l.id;renderTray();toast('移動先: '+locName(l.id),'ok');}else{S.sel.clear();openLocation(l.id);}return;}
  const p=palByCode(q.code);
  if(moveMode){if(!p){feedback(false);toast(q.code+' は在庫にありません','err');return;}
    if(S.tray.includes(p.id)){feedback(true);toast('追加済み: '+p.code);return;}
    S.tray.push(p.id);saveTray();feedback(true);renderTray();toast(`追加 ${p.code}・${M.mat.get(p.material_id)?.name||''}`,'ok');return;}
  feedback(true);openPallet(q.code);}

function bulkLocations(){formModal(`<div class="mt">保管場所の一括登録</div><div class="ms">1行1か所「コード,名称,エリア」。同じコードは上書きされます。</div>

  async f=>{await ensure(null,'admin');const lines=fv(f,'t').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let n=0;const base=S.locations.length;
    for(const [i,ln] of lines.entries()){const [code,name,area]=ln.split(/[,\t]/).map(s=>(s||'').trim());if(!code)continue;

function bulkMaterials(){if(!S.sections.length){toast('先にセクションを作成してください','err');return;}
  formModal(`<div class="mt">資材の一括登録</div><div class="ms">1行1品目「資材コード,資材名,分類,単位,1パレット標準数量」。登録済みのコードはスキップします。</div>
  <label class="field"><span>セクション</span><select name="sec">${S.sections.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label>

  <div class="row end"><button type="button" class="btn ghost" data-act="modalCancel">キャンセル</button><button class="btn primary" type="submit">登録</button></div>`,
  async f=>{const sec=fv(f,'sec').value;await ensure(sec,'edit');const lines=fv(f,'t').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let n=0,skip=0;
    const seen=new Set(S.materials.map(m=>String(m.code).toUpperCase()));
    for(const ln of lines){const [code,name,category,unit,std]=ln.split(/[,\t]/).map(s=>(s||'').trim());if(!code||!name)continue;
      if(seen.has(code.toUpperCase())){skip++;continue;}
      try{await upsertMaterial({section_id:sec,code,name,category,unit:unit||'個',std_qty:std||'',locked:false});seen.add(code.toUpperCase());n++;}
      catch(e){if(e?.message===CANCEL)throw e;throw new Error(`${code}: ${errMsg(e)}（${n}件は登録済み）`);}}

  view.innerHTML=`<div class="setup"><div class="card" style="padding:22px"><div class="eyebrow">FIRST SETUP</div><h1 style="margin:6px 0 4px;font-size:24px">初期設定</h1><div class="muted sm" style="margin-bottom:16px">データベースへの接続に成功しました。管理者パスワードと最初のセクションを設定します（最初の1回だけ）。</div>

    <div class="err" id="bootErr"></div><button class="btn primary block lg" type="submit">設定して開始</button></form></div></div>`;
  const f=$('#bootF');

      await auth.setPersistence(P().SESSION);

      catch(er){if(er.code==='auth/email-already-in-use')await auth.signInWithEmailAndPassword(ADMIN_EMAIL,a);else throw er;}
      const uid=auth.currentUser.uid;

function handleHash(cfgOnly){const h=location.hash.replace(/^#/,'');if(!h)return;const ps=new URLSearchParams(h);

  if(cfgOnly)return;const p=ps.get('p'),l=ps.get('l');if(!p&&!l)return;history.replaceState(null,'',location.pathname+location.search);
  if(p)openPallet(p);else{const lo=M.locByCode.get(String(l).toUpperCase());lo?openLocation(lo.id):toast('未登録の場所: '+l,'err');}}

  handleHash(true);renderNav();updateLockBtn();
  const c=cfg();if(!c.fb.apiKey||!c.fb.projectId){renderSetup();return;}
  if(!window.firebase||!firebase.firestore||!firebase.auth){renderSetup('Firebaseの部品を読み込めません（ネットワークを確認してください）');return;}
  try{
    fbApp=firebase.initializeApp({apiKey:c.fb.apiKey,authDomain:c.fb.authDomain||c.fb.projectId+'.firebaseapp.com',projectId:c.fb.projectId,appId:c.fb.appId||undefined});
    auth=fbApp.auth();db=fbApp.firestore();
    try{db.settings({experimentalAutoDetectLongPolling:true,merge:true});}catch(e){}
    try{await db.enablePersistence({synchronizeTabs:true});}catch(e){}
    view.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';
    await new Promise(r=>{const un=auth.onAuthStateChanged(()=>{un();r();});});
    if(!auth.currentUser)await signInAnon();
    await loadRole();
    auth.onAuthStateChanged(async u=>{if(!u){try{await signInAnon();}catch(e){}}await loadRole();if(S.ready)refreshViews();});
    const boot=await db.collection('meta').doc('bootstrap').get();
    if(!boot.exists){renderBootstrap();return;}
    await startApp();
  }catch(e){renderSetup('接続できません: '+errMsg(e)+(e?.code?` [${e.code}]`:''));}
}
init();

</script>
</body>
</html>
